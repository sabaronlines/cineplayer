<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePlayer Stream & Downloader</title>
  <style>
    body {
      background-color: #070b14;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      margin: 0;
    }
    .player-card {
      width: 100%;
      max-width: 860px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
    }
    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .player-title {
      font-size: 18px;
      font-weight: 700;
      color: #f59e0b;
      margin: 0;
    }
    .server-status {
      font-size: 12px;
      color: #10b981;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .server-status::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="player-header">
      <h3 class="player-title">▶ Watch & Convert Movie</h3>
      <span class="server-status">Streaming Server Online</span>
    </div>

    <!-- 1. Player Box Container -->
    <div id="CinePlayer"></div>
  </div>

  <!-- 2. Self-Hosted Player Configurations -->
  <script>
    const CinePlayerConfigs = {
      id: 'CinePlayer',
      src: 'tt31349844', // Movie ka IMDb ID

      // Stream Manifest (HLS Adaptive Stream)
      streamUrl: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',

      // Central Ads File Path
      adApiUrl: '/ads.json',

      // Watermark Branding
      watermark: {
        type: 'text',
        content: '⚡ CINEPLAYER'
      }
    };
  </script>

  <!-- 3. Main Player Engine Script -->
  <script src="/cineplayer.js"></script>

</body>
</html>
